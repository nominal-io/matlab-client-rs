[workspace]
members = ["crates/ffi"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = true
strip = true

# Iteration profile. Fat LTO in `release` re-optimizes the whole dependency
# graph on every edit to this crate, which costs ~2 minutes per rebuild. Turning
# it off trades some runtime performance for a fast edit-build loop.
[profile.fast]
inherits = "release"
lto = false
opt-level = 2
strip = false
