[package]
name = "nominal-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI bindings for the Nominal API, linked into the MATLAB MEX gateway"

[lib]
# staticlib is what ships: the MEX gateway links it in directly, so MATLAB loads
# one binary rather than a .mexw64 that in turn has to find a .dll beside it.
# rlib additionally lets the test harness link the crate.
crate-type = ["staticlib", "rlib"]

[dependencies]
nominal = "0.7"
# Pinned exactly, and not casually. `nominal` 0.7.x wants nominal-api ^0.1349,
# and nominal-streaming moved to ^0.1379 in 0.9.4. Cargo treats 0.1349 and
# 0.1379 as incompatible — for a 0.x crate the minor version is the breaking
# position — so any pairing other than this one compiles nominal-api-conjure
# twice. That crate is 3,574 generated files and ~300 MB of rlib, so the
# duplicate roughly doubles a cold build.
#
# 0.9.3 is the newest streaming release that still agrees with nominal 0.7.1.
# Lift this the moment `nominal` moves past 0.1349, and prefer matching whatever
# nominal-api version `nominal` is on rather than taking the newest streaming.
nominal-streaming = "=0.9.3"
# Declare what runtime.rs actually uses: new_multi_thread() needs
# rt-multi-thread, enable_all() needs net and time. These currently arrive
# anyway through nominal-streaming's `full`, but relying on feature unification
# means an upstream change breaks the build here for no visible reason.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }
once_cell = "1.20"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["clock"] }
# Streamed response bodies (exports) arrive as a Stream; this is already in the
# dependency graph via `nominal`, so it costs nothing extra to compile.
futures = "0.3"
# The SQL service's proto declares Query as server-streaming gRPC, but the
# gateway only ever exposes it as HTTPS+JSON returning one concatenated body —
# so it is reached over plain HTTP, not tonic. The Python client carries a
# hand-written REST shim for the same reason.
#
# 0.12 matches what `nominal` uses. It does not unify the tree: `nominal-streaming`
# pulls reqwest 0.13, so two versions compile either way, and picking 0.13 here
# would not change that. Follow whichever version `nominal` moves to.
#
# Keep default-features = false — it stops native-tls/OpenSSL entering the graph.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
] }
serde_json = "1"
# SQL results come back as an Arrow IPC stream whose buffers are ZSTD-compressed
# server-side with no opt-out, hence `ipc_compression`. This is the only genuinely
# new dependency in the tree.
arrow = { version = "56", features = ["ipc_compression"] }
